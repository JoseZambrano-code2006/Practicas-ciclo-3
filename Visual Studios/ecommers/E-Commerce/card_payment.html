<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="resources/img/logo/Logo-PavoReal.png" type="image/x-icon">
    <link rel="stylesheet" href="resources/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/css/card_payment.css">
    <title>Commerline</title>
</head>

<body>

    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="card tarjeta-principal w-100 px-3 py-3">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-5 tarjeta-grafica d-flex justify-content-center">

                    <div class="payment-card">
                        <div class="card-logo">
                            <i class="fab fa-cc-visa"></i>
                        </div>
                        <div class="card-number">
                            <span id="card-preview">•••• •••• •••• ••••</span>
                        </div>
                        <div class="card-details">
                            <div>
                                <small>Titular de la tarjeta</small>
                                <div id="cardholder-preview">NOMBRE DEL TITULAR</div>
                            </div>
                            <div>
                                <small>Expira</small>
                                <div id="expiry-preview">••/••</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card tarjeta-de-pago mx-auto">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Añade Una Tarjeta</h2>
                            <form id="payment-form">
                                <div class="mb-3">
                                    <label for="cardholder-name" class="form-label">Nombre del titular
                                        <i class="fa-solid fa-circle-question" style="color: #9fa0a3;"
                                            data-bs-toggle="tooltip" data-bs-placement="right"
                                            data-bs-title="El campo queda invalido si ingresas un primer nombre o una inicial cualquiera. Debes ingresar tu nombre y apellido completo para que sea validado"></i>
                                    </label>
                                    <input type="text" class="form-control" id="cardholder-name"
                                        placeholder="Nombre y apellido completo del titular de la tarjeta" required>
                                </div>

                                <div class="mb-3 card-number-input">
                                    <label for="card-number" class="form-label">Número de tarjeta</label>
                                    <div class="position-relative">

                                        <input type="password" class="form-control" id="card-number"
                                            placeholder="1234 5678 9012 3456" maxlength="19" required>
                                        <button
                                            class="btn position-absolute end-0 top-50 translate-middle-y bg-transparent border-0 p-0 me-3"
                                            type="button" id="toggle-card-number"
                                            aria-label="Mostrar/ocultar número de tarjeta">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3 card-expiry-input">
                                        <label for="card-expiry" class="form-label">Fecha de expiración</label>
                                        <input type="text" class="form-control" id="card-expiry" placeholder="MM/AA"
                                            maxlength="5" required>
                                    </div>
                                    <div class="col-md-6 mb-3 card-cvc-input">
                                        <label for="card-cvc" class="form-label">Código de seguridad</label>
                                        <div class="position-relative">

                                            <input type="password" class="form-control" id="card-cvc" placeholder="CVC"
                                                minlength="3" maxlength="4" required>
                                            <button
                                                class="btn position-absolute end-0 top-50 translate-middle-y bg-transparent border-0 p-0 me-3"
                                                type="button" id="toggle-cvc"
                                                aria-label="Mostrar/ocultar código de seguridad">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="amount" class="form-label">Monto a pagar</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="amount" value="100.00" required>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg btn-comprar">
                                        <i class="fas fa-lock me-2"></i> Pagar ahora
                                    </button>
                                </div>
                            </form>

                            <div class="text-center mt-3">
                                <img src="https://www.paypalobjects.com/webstatic/mktg/Logo/pp-logo-100px.png"
                                    alt="PayPal" class="me-3">
                                <img src="https://cdn.worldvectorlogo.com/logos/stripe-2.svg" alt="Stripe"
                                    style="height: 30px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="resources/js/bootstrap.bundle.min.js"></script>

    <script src="resources/js/sweetalert2.js"></script>

    <script src="resources/img/icons/iconos.js"></script>

    <script src="resources/js/tooltip.js"></script>

    <script src="resources/js/card_payment.js"></script>

    <script src="resources/js/mostrar_ocultar_contraseña.js"></script>

    <script src="resources/js/controles.js"></script>

</body>

</html>
