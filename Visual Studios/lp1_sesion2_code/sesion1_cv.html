<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Profesional</title>
</head>
<body>
    <header>
        <h1>Perfil Profesional</h1>
    </header>
    
    <section>
        <h2>Información Personal</h2>
        <img src="perfil.jpg" alt="Foto de Perfil" width="150">
        <p><strong>Nombre:</strong> Juan Pérez</p>
        <p><strong>Correo Electrónico:</strong> juanperez@email.com</p>
        <p><strong>Teléfono:</strong> +51 987 654 321</p>
    </section>
    
    <section>
        <h2>Sexo</h2>
        <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
        <label><input type="radio" name="sexo" value="femenino"> Femenino</label>
    </section>
    
    <section>
        <h2>Habilidades</h2>
        <ul>
            <li>Desarrollo Web</li>
            <li>Programación en Java</li>
            <li>Administración de Bases de Datos</li>
            <li>Gestión de Proyectos</li>
        </ul>
    </section>
    
    <section>
        <h2>Hobbies</h2>
        <label><input type="checkbox" name="hobby" value="lectura"> Lectura</label>
        <label><input type="checkbox" name="hobby" value="deportes"> Deportes</label>
        <label><input type="checkbox" name="hobby" value="viajes"> Viajes</label>
        <label><input type="checkbox" name="hobby" value="música"> Música</label>
    </section>
    
    <section>
        <h2>Video de Presentación</h2>
        <video width="320" height="240" controls>
            <source src="video_presentacion.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de videos.
        </video>
    </section>
</body>
</html>
