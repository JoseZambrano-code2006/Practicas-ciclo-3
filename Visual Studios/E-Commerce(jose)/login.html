<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="resources/img/logo/Logo-PavoReal.png" type="image/x-icon">
    <link rel="stylesheet" href="resources/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/css/login.css">
    <title>Commerline</title>
</head>

<body>

    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 px-2 py-4">
        <div class="card cuadro-principal">
            <div class="row g-0 justify-content-center align-items-center">
                <div class="col-12 col-md-6 d-flex justify-content-center">
                    <div class="card-body text-center descripcion-logo px-2 py-4">
                        <a href="index.html"><img src="resources/img/logo/Logo-PavoReal.png"
                                class="img-fluid rounded-start logo" alt="Login Pavo Real"></a>

                        <p class="card-text h5 mt-3 mb-0">Haz de cada compra una experiencia única.</p>
                        <p class="card-text h5">Disfruta de un mundo de posibilidades.</p>

                        <div class="col-12 text-center mt-4">
                            <a class="btn home-button" href="index.html" role="button">
                                <i class="fas fa-arrow-left me-2"></i>Regresar al Inicio</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 px-1 py-3">
                    <div class="card credenciales-logo mx-auto py-2">
                        <div class="card-body">
                            <h3 class="card-title text-center mb-4">Credenciales de Acceso</h3>
                            <form class="row g-3">
                                <div class="col-12 card-usuario-input">
                                    <label for="usuario-login" class="form-label">Usuario:</label>
                                    <input type="text" class="form-control" id="usuario-login"
                                        placeholder="Introduzca su nombre de usuario" required>
                                </div>
                                <div class="col-12 card-contraseña-input">
                                    <label for="contraseña-login" class="form-label">Contraseña:</label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control" id="contraseña-login"
                                            placeholder="Introduzca su contraseña" required>
                                        <button
                                            class="btn position-absolute end-0 top-50 translate-middle-y bg-transparent border-0 p-0 me-3"
                                            type="button" id="toggle-contraseña-login"
                                            aria-label="Mostrar/ocultar contraseña">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-12 text-center d-grid gap-2">
                                    <button class="btn button-login py-2 mt-3" type="submit"
                                        onclick="window.location.href='index.html'">Iniciar Sesión</button>
                                </div>
                                <div class="col-12 text-center">
                                    <a href="forgot_password.html" class="card-link link-forgot">¿Olvidaste tu
                                        contraseña?</a>
                                </div>
                                <hr class="my-2">
                                <div class="col-12 text-center mb-2">
                                    <a class="btn button-register px-5 py-2" href="register_profile.html"
                                        role="button">Registrarse</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="resources/js/bootstrap.bundle.min.js"></script>

    <script src="resources/img/icons/iconos.js"></script>

    <script src="resources/js/mostrar_ocultar_contraseña.js"></script>

</body>

</html>
