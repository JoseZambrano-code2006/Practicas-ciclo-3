<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="resources/img/logo/Logo-PavoReal.png" type="image/x-icon">
  <link rel="stylesheet" href="resources/css/bootstrap.min.css">
  <link rel="stylesheet" href="resources/css/forgot_password.css">
  <title>Commerline</title>
</head>

<body>

  <div class="container-fluid contenedor-principal">

    <div class="card">
      <div class="card-body mx-3 my-3">
        <h4 class="card-title">Recuperar Contraseña</h4>

        <form class="row">
          <div class="col-12">
            <label for="email" class="col-form-label my-2">E-Mail:</label>
            <input type="email" class="form-control py-2" id="email"
              placeholder="Añade su correo para recuperar la cuenta" required>
          </div>

          <div class="col-12 logger-profile">
            <button class="btn mt-4 px-5 register-b" type="submit"><i class="fa-solid fa-user-lock"></i> Enviar</button>
          </div>

          <div class="col-12 mt-4 profile-link">
            <a href="login.html" class="go-back">Volver al inicio de sesión</a>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script src="resources/js/bootstrap.bundle.min.js"></script>

  <script src="resources/img/icons/iconos.js"></script>

</body>

</html>
